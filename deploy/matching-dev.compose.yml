name: ds03-matching-dev
services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Run npm run matching:setup:dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run npm run matching:setup:dev}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - matching-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  matching-rabbitmq-data:
